<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      This is a fallback shell only. Every route sets its own title, meta
      description, canonical, Open Graph, and Twitter tags via
      src/components/SEO.tsx (react-helmet-async) once React mounts.
      Non-JS crawlers (social link-unfurl bots) will see only these fallback
      values — see SEO-AUDIT.md Section 0 for that documented tradeoff.
    -->
    <title>Meraki Weddings | Wedding Ceremony Audio Without a DJ | Tri-Cities, WA</title>
    <meta
      name="description"
      content="Professional wedding ceremony audio in the Tri-Cities, WA for couples without a DJ. Microphones, speakers, and ceremony music playback from the team at Meraki Audio."
    />
    <link rel="canonical" href="https://weddings.merakiaud.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meraki Weddings | Wedding Ceremony Audio Without a DJ" />
    <meta
      property="og:description"
      content="Professional wedding ceremony audio in the Tri-Cities, WA for couples without a DJ — microphones, speakers, and ceremony music playback."
    />
    <meta property="og:url" content="https://weddings.merakiaud.com/" />
    <meta property="og:site_name" content="Meraki Weddings" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meraki Weddings | Wedding Ceremony Audio Without a DJ" />
    <meta
      name="twitter:description"
      content="Professional wedding ceremony audio in the Tri-Cities, WA for couples without a DJ."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Google Analytics 4 (Meraki Weddings property, created 2026-07-27).
      Loaded directly here (not via a JS-injected tag) so it fires as early
      as possible and doesn't depend on React having mounted. analytics.ts
      only calls window.gtag if it exists, so this is the single place that
      turns tracking "on" for the whole site.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VFZ04LZBTN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VFZ04LZBTN');
    </script>

    <!--
      Site-wide structured data only (doesn't change per route).
      Meraki Weddings is modeled as a Service offered by the Meraki Audio
      Organization, not as a separate/unrelated business entity — see
      CROSS-SITE-SEO-PLAN.md for the reasoning.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Meraki Audio",
        "url": "https://merakiaud.com/",
        "areaServed": [
          "Richland WA",
          "Kennewick WA",
          "Pasco WA",
          "Benton City WA",
          "Prosser WA",
          "Walla Walla WA",
          "Tri-Cities WA"
        ],
        "makesOffer": {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Meraki Weddings",
            "serviceType": "Wedding ceremony audio",
            "url": "https://weddings.merakiaud.com/",
            "description": "Wedding ceremony audio for couples without a DJ: microphones, speakers, and ceremony music playback."
          }
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Meraki Weddings",
        "url": "https://weddings.merakiaud.com/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
